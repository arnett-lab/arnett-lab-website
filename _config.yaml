# site properties and page defaults
title: Arnett Lab
subtitle: 
description: "ADHD is one of the most common conditions of childhood: About 1 in 9 children in the U.S. has been diagnosed. But two children with the same diagnosis can look completely different. They have different strengths, different struggles, and different responses to the same treatment. At the Arnett Lab, we study how children's brains, genes, and everyday lives shape ADHD. Our goal is to move toward a future where ADHD care is more precise, more personalized, and better suited to each child's unique needs."
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  email: arnettlab@childrens.harvard.edu
  google-scholar: ETJoidYAAAAJ

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
